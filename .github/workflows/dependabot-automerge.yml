name: Dependabot auto-merge

# Builds and tests every Dependabot PR into test, then merges it if the update is a minor or patch
# version. Majors stay open for a person (Velopack is not proposed at all — see dependabot.yml). Nothing
# here releases anything: the release workflows run on tags only, and the merge itself, made with the
# workflow token, starts no other workflow.
#
# pull_request, not pull_request_target: the PR's code runs with a token scoped to this workflow, and
# only the merge job — which runs no PR code — can write. Every job is gated on the PR's author being
# Dependabot, so other PRs into test run nothing here.

on:
  pull_request:
    branches: [ test ]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      # ScdAudioTests references the app, so this builds it too (win-x86, as the releases do).
      - name: Test the app
        run: dotnet test devtools/ScdAudioTests/ScdAudioTests.csproj -c Release

      - name: Build the harnesses
        shell: pwsh
        run: |
          dotnet build devtools/TexHarness/TexHarness.csproj -c Release
          dotnet build devtools/TmbHarness/TmbHarness.csproj -c Release

  merge:
    needs: test
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Only an explicit minor or patch merges; a major, or a grouped PR holding one, never matches.
      - name: Merge a minor or patch update
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.meta.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$PR_URL" --merge
