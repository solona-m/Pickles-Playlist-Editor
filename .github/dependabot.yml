# Dependabot version updates. Every PR targets `test`, never `main` (the release branch).
#
# GitHub reads this file from the DEFAULT branch only, which is `main`: nothing here takes effect until
# `test` is next merged into `main`. After that merge, check Insights -> Dependency graph -> Dependabot
# that each ecosystem's update job succeeded.
#
# PRs get no CI build (the only workflows are the tag-triggered releases), so build the app and try a
# bump before merging. Security-update PRs stay off: GitHub always opens them against main.

version: 2
updates:
  - package-ecosystem: nuget
    # The app and the three devtools harnesses, listed explicitly so none is missed.
    directories:
      - "/"
      - "/devtools/ScdAudioTests"
      - "/devtools/TexHarness"
      - "/devtools/TmbHarness"
    target-branch: "test"
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "test"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [ minor, patch ]
