# Dependabot version updates. Every PR targets `test`, never `main` (the release branch).
#
# GitHub reads this file from the DEFAULT branch only, which is `main`: nothing here takes effect until
# `test` is next merged into `main`. After that merge, check Insights -> Dependency graph -> Dependabot
# that each ecosystem's update job succeeded.
#
# workflows/dependabot-automerge.yml builds and tests each PR and merges minor and patch updates into
# test by itself; majors stay open — build the app and try those before merging. Every merge on GitHub
# moves origin/test: pull before the next local merge into it. Security-update PRs stay off: GitHub
# always opens them against main.

version: 2
updates:
  - package-ecosystem: nuget
    # The app and the three devtools harnesses, listed explicitly so none is missed.
    directories:
      - "/"
      - "/devtools/ScdAudioTests"
      - "/devtools/TexHarness"
      - "/devtools/TmbHarness"
    target-branch: "test"
    schedule:
      interval: weekly
    # A version is proposed only once it has been public for 3 days: most hijacked releases are pulled by then.
    cooldown:
      default-days: 3
    ignore:
      # The Velopack library must match the vpk CLI the release workflows install (VPK_VERSION), which
      # Dependabot cannot see: bump both together by hand.
      - dependency-name: "Velopack"
    groups:
      nuget-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "test"
    schedule:
      interval: weekly
    # A version is proposed only once it has been public for 3 days: most hijacked releases are pulled by then.
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [ minor, patch ]
